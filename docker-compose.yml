services:
  redis:
    image: redis:7-alpine
    container_name: orion-ledger-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-orion_redis_dev}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-orion_redis_dev}",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
